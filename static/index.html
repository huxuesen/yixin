<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="医信">
<meta name="theme-color" content="#1677ff">
<title>医信</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eef4ff 0%,#f7f9fc 220px);color:#1f2937;font-size:15px;min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:28px 20px 40px}
  /* ---- brand ---- */
  .brand{text-align:center;padding:28px 0 8px}
  .brand img{width:88px;height:88px;border-radius:22px;box-shadow:0 8px 24px rgba(22,119,255,.28)}
  .brand h1{margin:14px 0 4px;font-size:28px;font-weight:700;letter-spacing:6px}
  .brand p{margin:0;color:#8a94a6;font-size:13px;letter-spacing:1px}
  /* ---- card ---- */
  .card{background:#fff;border-radius:18px;padding:22px 20px;box-shadow:0 2px 16px rgba(15,23,42,.07)}
  .err{color:#cf1322;background:#fff2f0;border:1px solid #ffccc7;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:none;font-size:14px}
  label{display:block;font-size:13px;color:#6b7280;margin:2px 0 6px}
  input[type=text],input[type=password]{width:100%;padding:13px 14px;border:1px solid #dfe3ea;border-radius:12px;margin-bottom:16px;font-size:16px;background:#f9fafb;outline:none;-webkit-appearance:none}
  input[type=text]:focus,input[type=password]:focus{border-color:#1677ff;background:#fff;box-shadow:0 0 0 3px rgba(22,119,255,.12)}
  .btn{width:100%;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer}
  .btn.primary{background:#1677ff;color:#fff;box-shadow:0 4px 14px rgba(22,119,255,.35)}
  .btn.primary:active{transform:translateY(1px)}
  .btn.primary:disabled{opacity:.55}
  .btn.home{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 6px 18px rgba(34,197,94,.35);font-size:18px;padding:16px}
  .btn.home:active{transform:translateY(1px)}
  .note{text-align:center;color:#9aa3b2;font-size:12px;margin:16px 0 0}
  /* ---- identity ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 18px}
  .topbar .id{display:flex;align-items:center;gap:10px}
  .topbar img{width:36px;height:36px;border-radius:9px;box-shadow:0 2px 8px rgba(22,119,255,.25)}
  .topbar .id b{font-size:17px;letter-spacing:2px}
  .logout{background:none;border:0;color:#8a94a6;font-size:14px;padding:8px}
  .who{text-align:center;padding:10px 0 18px}
  .who .name{font-size:30px;font-weight:700;letter-spacing:2px}
  .who .sub{color:#6b7280;font-size:14px;margin-top:6px}
  .kv{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-top:1px solid #f1f3f5}
  .kv:first-of-type{border-top:0}
  .kv span{color:#8a94a6;font-size:14px}
  .kv b{font-size:15px;font-weight:600}
  .hint{text-align:center;color:#9aa3b2;font-size:12px;margin:14px 0 0;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <div id="loginView">
    <div class="brand">
      <img src="/icon.png" alt="医信">
      <h1>医信</h1>
      <p>临沂市第三人民医院</p>
    </div>
    <div class="card">
      <div class="err" id="loginErr"></div>
      <label for="userName">工号</label>
      <input type="text" id="userName" placeholder="请输入工号" autocomplete="username" inputmode="numeric">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入登录密码" autocomplete="current-password">
      <button class="btn primary" id="loginBtn">登 录</button>
    </div>
  </div>

  <!-- 登录后：身份 + 首页按钮 -->
  <div id="mainView" style="display:none">
    <div class="topbar">
      <div class="id"><img src="/icon.png" alt=""><b>医信</b></div>
      <button class="logout" id="logoutBtn">退出</button>
    </div>
    <div class="card">
      <div class="who">
        <div class="name" id="whoName"></div>
        <div class="sub" id="whoDept"></div>
      </div>
      <div class="kv"><span>医院</span><b id="whoHospital"></b></div>
      <div style="height:18px"></div>
      <button class="btn home" onclick="location.href='/h5/'">首 页</button>
    </div>
  </div>

</div>
<script>
const $=s=>document.querySelector(s);

async function j(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(r.status===401){showLogin();throw new Error(d.message||'请重新登录')}if(!r.ok)throw new Error(d.message||('请求失败 '+r.status));return d}

function showLogin(){$('#loginView').style.display='';$('#mainView').style.display='none'}
function showMain(d){
  $('#loginView').style.display='none';$('#mainView').style.display='';
  $('#whoName').textContent=d.userName||'';
  $('#whoDept').textContent=d.deptName||'';
  $('#whoHospital').textContent=d.hospitalName||'';
}

$('#loginBtn').onclick=async()=>{
  const b=$('#loginBtn');b.disabled=true;$('#loginErr').style.display='none';
  try{
    const d=await j('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userName:$('#userName').value,password:$('#password').value})});
    $('#password').value='';
    showMain(d);
  }catch(e){const el=$('#loginErr');el.textContent=e.message;el.style.display=''}
  b.disabled=false;
};
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
$('#logoutBtn').onclick=async()=>{await fetch('/api/logout',{method:'POST'});showLogin()};

// restore session on load
(async()=>{try{const d=await j('/api/me');showMain(d)}catch(e){showLogin()}})();
</script>
</body>
</html>
